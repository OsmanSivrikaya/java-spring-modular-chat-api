server:
  port: 8080
spring:
  application:
    name: modular-chat-api
  datasource:
    url: jdbc:postgresql://localhost:5432/chat_db
    username: postgres
    password: your_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # otomatik tablo update
      ddl-auto: update
      #sql sorgularını çalışan terminale yazması için
    show-sql: true
    properties:
      hibernate:
        format_sql: true
# JWT Yapılandırması (.NET appsettings "JwtSettings" karşılığı)
application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000 # 1 gün (milisaniye cinsinden)