<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Chat Test İstemcisi</title>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 20px auto; padding: 0 16px; }
  fieldset { margin-bottom: 12px; } input { margin: 2px; }
  #log { border: 1px solid #ccc; height: 260px; overflow-y: auto; padding: 8px; font-size: 14px; }
</style>
</head>
<body>
<h2>Modular Chat API – Test</h2>
<fieldset><legend>1. Kayıt / Giriş</legend>
  <input id="username" placeholder="kullanıcı adı">
  <input id="email" placeholder="email">
  <input id="password" type="password" placeholder="şifre">
  <button onclick="auth('register')">Kayıt</button>
  <button onclick="auth('login')">Giriş</button>
  <div id="me"></div>
</fieldset>
<fieldset><legend>2. Sohbet</legend>
  <input id="otherId" placeholder="karşı kullanıcı id" size="14">
  <button onclick="createDirect()">Birebir sohbet aç</button>
  <input id="convId" placeholder="sohbet id" size="8">
  <button onclick="join()">Sohbete katıl</button>
</fieldset>
<div id="log"></div>
<input id="text" placeholder="mesaj" size="60" onkeydown="if(event.key==='Enter')send()">
<button onclick="send()">Gönder</button>

<script>
let token = null, client = null, sub = null;
const $ = id => document.getElementById(id);
const log = t => { $('log').insertAdjacentHTML('beforeend', '<div></div>'); $('log').lastChild.textContent = t; $('log').scrollTop = 1e9; };

async function api(method, url, body) {
  const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json', ...(token && { Authorization: 'Bearer ' + token }) },
    body: body && JSON.stringify(body) });
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error((data && data.detail) || res.status);
  return data;
}

async function auth(kind) {
  try {
    const body = { email: $('email').value, password: $('password').value };
    if (kind === 'register') body.username = $('username').value;
    const r = await api('POST', '/api/auth/' + kind, body);
    token = r.token;
    const me = await api('GET', '/api/users/me');
    $('me').textContent = `Giriş yapıldı: ${me.username} (id=${me.id})`;
    connect();
  } catch (e) { alert(e.message); }
}

function connect() {
  client = new StompJs.Client({
    brokerURL: `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`,
    connectHeaders: { Authorization: 'Bearer ' + token },
    onConnect: () => {
      log('[socket bağlandı]');
      client.subscribe('/user/queue/errors', m => log('HATA: ' + JSON.parse(m.body).error));
      client.subscribe('/topic/presence', m => { const p = JSON.parse(m.body); log(`[${p.user.username} ${p.online ? 'çevrimiçi' : 'çevrimdışı'}]`); });
    },
    onStompError: f => log('STOMP hata: ' + f.headers.message)
  });
  client.activate();
}

async function createDirect() {
  try { const c = await api('POST', '/api/conversations/direct', { userId: Number($('otherId').value) });
    $('convId').value = c.id; join(); } catch (e) { alert(e.message); }
}

async function join() {
  const id = $('convId').value;
  if (sub) sub.unsubscribe();
  $('log').innerHTML = '';
  const page = await api('GET', `/api/conversations/${id}/messages?size=50`);
  page.content.reverse().forEach(m => log(`${m.sender.username}: ${m.content}`));
  sub = client.subscribe('/topic/conversations/' + id, m => { const msg = JSON.parse(m.body); log(`${msg.sender.username}: ${msg.content}`); });
}

function send() {
  if (!client || !$('text').value) return;
  client.publish({ destination: '/app/chat.send', body: JSON.stringify({ conversationId: Number($('convId').value), content: $('text').value }) });
  $('text').value = '';
}
</script>
</body>
</html>
